<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - v1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <aside class="panel history-panel">
            <div class="panel-header">
                <h2>Lịch sử</h2>
                <button id="clearHistoryBtn" class="danger-btn">Xóa lịch sử</button>
            </div>

            <div class="history-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Thời gian kết thúc</th>
                            <th>X</th>
                            <th>O</th>
                            <th>Kết quả</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
                <div id="emptyHistory" class="empty-history">Chưa có ván nào.</div>
            </div>
        </aside>

        <section class="game-area">
            <h1>Tic Tac Toe</h1>

            <div class="players">
                <div id="playerXLabel">Player 1 (X)</div>
                <div id="playerOLabel">Player 2 (O)</div>
            </div>

            <div id="board" class="board" aria-label="Bàn cờ Tic Tac Toe">
                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>
                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>
                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>
            </div>

            <div id="turnInfo" class="turn-info">X sẽ đi trước</div>
            <button id="replayBtn" class="secondary-btn">Chơi lại</button>
        </section>

        <aside class="panel config-panel">
            <h2>Cấu hình</h2>

            <label for="firstPlayer">Ký tự đánh trước</label>
            <select id="firstPlayer">
                <option value="X">X</option>
                <option value="O">O</option>
            </select>

            <label for="playerXName">Tên người chơi X</label>
            <input id="playerXName" type="text" maxlength="30" value="Player 1">

            <label for="playerOName">Tên người chơi O</label>
            <input id="playerOName" type="text" maxlength="30" value="Player 2">

            <button id="clearConfigBtn" class="danger-btn">Xóa cấu hình</button>

            <div class="config-note">
                Cấu hình sẽ bị khóa sau nước đi đầu tiên.
            </div>
        </aside>
    </main>

    <div id="resultModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="resultTitle">Kết quả</h2>
            <p id="resultMessage"></p>
            <button id="newGameBtn" class="primary-btn">Ván mới</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
